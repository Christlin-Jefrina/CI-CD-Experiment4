name: CI-CD Experiment 4

on:
  push:
    branches:
      - main

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x automation.sh test.sh analyze_results.sh

      - name: Run automated tests
        run: ./test.sh

      - name: Run automation
        run: ./automation.sh

      - name: Display automation log
        run: cat automation.log

      - name: Generate pipeline report
        if: always()
        run: |
          echo "CI/CD Pipeline Report" > pipeline_report.txt
          echo "======================" >> pipeline_report.txt
          echo "Project: CI-CD-Experiment4" >> pipeline_report.txt
          echo "Automated tests completed." >> pipeline_report.txt
          echo "Pipeline status: ${{ job.status }}" >> pipeline_report.txt

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline_report.txt

      - name: Run prompt-based analysis
        if: always()
        run: |
          chmod +x analyze_results.sh
          ./analyze_results.sh

      - name: Upload prompt analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-analysis-report
          path: prompt_analysis.txt

      - name: Update Agile task on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1
            });

            if (issue.data.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body: '✅ CI/CD pipeline completed successfully. Automated tests passed and the Agile task is completed.'
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                state: 'closed'
              });

              console.log('Agile Issue #1 closed successfully.');
            } else {
              console.log('Agile Issue #1 is already closed.');
            }

      - name: Update Agile task on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '❌ CI/CD pipeline failed. Please inspect the failed workflow steps and correct the issue.'
            });

            console.log('Agile Issue #1 remains open because the pipeline failed.');
